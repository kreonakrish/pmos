# =============================================================================
# PMOS Client — nginx config
# - Static SPA from /usr/share/nginx/html
# - /v1, /health proxied to gateway:4000 (compose-internal hostname)
# - WebSocket upgrade on /v1/ws/*
# - /config.js is generated at container start by docker-entrypoint
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Healthcheck used by Docker / load balancers
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Runtime-injected config: never cache
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /config.js =404;
    }

    # Long-cache hashed assets emitted by Vite (e.g. /assets/foo.abc123.js)
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Use Docker's embedded DNS so upstream hostnames resolve at request time
    # (not at nginx startup). Lets the client container start even if gateway
    # is not yet up.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # API + WebSocket → gateway
    location /v1 {
        set                $upstream_gateway "http://gateway:4000";
        proxy_pass         $upstream_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        set              $upstream_gateway "http://gateway:4000";
        proxy_pass       $upstream_gateway;
        proxy_set_header Host $host;
    }

    # SPA fallback — must come last
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
