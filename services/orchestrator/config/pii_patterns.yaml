patterns:
  - kind: SSN
    regex: '\b\d{3}-\d{2}-\d{4}\b'
  - kind: EMAIL
    regex: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
  - kind: PHONE_US
    regex: '\b(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b'
  - kind: CREDIT_CARD
    regex: '\b(?:\d[ -]*?){13,19}\b'
  - kind: IBAN
    regex: '\b[A-Z]{2}\d{2}[A-Z0-9]{4,30}\b'
  - kind: DOB
    regex: '\b(?:19|20)\d{2}[-/](?:0?[1-9]|1[0-2])[-/](?:0?[1-9]|[12]\d|3[01])\b'
allowlist:
  emails:
    - support@pmos.example
